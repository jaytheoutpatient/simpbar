# ! Auto-generated by matugen — do not edit. Edit ~/simpbar/matugen/foot-colors.ini instead.
# Included from ~/.config/foot/foot.ini:  include=~/.config/foot/colors.ini
#
# Section name is [colors-dark] to match foot's default initial-color-theme.
# The background/foreground block that used to live in foot.ini's own
# [colors-dark] was removed so this file's values are the ones that apply.

[colors-dark]
alpha=0.85

background={{ colors.surface_dim.dark.hex_stripped }}
foreground={{ colors.on_surface.dark.hex_stripped }}

## Normal/regular colors (color palette 0-7)
regular0={{ colors.surface_container_highest.dark.hex_stripped }}  # black
regular1={{ colors.error.dark.hex_stripped }}  # red
regular2=a6e3a1  # green (fixed mint — MD3 has no green channel)
regular3=f9e2af  # yellow (fixed amber)
regular4={{ colors.primary.dark.hex_stripped }}  # blue
regular5={{ colors.tertiary.dark.hex_stripped }}  # magenta
regular6=89dceb  # cyan (fixed sky)
regular7={{ colors.on_surface.dark.hex_stripped }}  # white

## Bright colors (color palette 8-15)
bright0={{ colors.surface_variant.dark.hex_stripped }}  # bright black
bright1={{ colors.error.dark.hex_stripped }}  # bright red
bright2=b6f2b0  # bright green
bright3=fce5be  # bright yellow
bright4={{ colors.primary.dark.hex_stripped }}  # bright blue
bright5={{ colors.on_tertiary_container.dark.hex_stripped }}  # bright magenta
bright6=a0ecf5  # bright cyan
bright7=ffffff  # bright white

## Misc colors
cursor={{ colors.on_surface.dark.hex_stripped }} {{ colors.primary.dark.hex_stripped }}
selection-foreground={{ colors.surface_container_lowest.dark.hex_stripped }}
selection-background={{ colors.primary.dark.hex_stripped }}