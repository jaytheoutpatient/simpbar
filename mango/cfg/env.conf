# | Environment Variables |
# Set your environment variables here. | https://mangowm.github.io/docs/configuration/basics#environment-variables
#
# NOTE: values here REPLACE the inherited variable, and are re-applied on every
# reload_config. Keep ~/.local/bin first so the simpbar helpers (simpbar,
# simpbar-shell, simpbar-wallpaper, simpbar-matugen, appdrawer) are found by
# name from keybinds and autostart.
#
# __HOME__ is a placeholder the install script replaces with the target user's
# home directory when it deploys this config.
env = PATH,__HOME__/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl
env = QT_QPA_PLATFORMTHEME,qt6ct
