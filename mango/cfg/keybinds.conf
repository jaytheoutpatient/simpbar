# | Keybinds |
# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys
#
# ligma
# Simpbar desktop bindings. Panel
# functions now map onto the simpbar stack: the quickshell app drawer (whose
# Power menu covers logout/reboot), swaync, the simpbar config app and the
# simpbar-shell overview.

# Your favorite applications.
bind = SUPER, Return, spawn, alacritty
bind = SUPER, e, spawn, dolphin
bind = SUPER, b, spawn, firefox

# Please choose the text editor of your choice.
# bind = SUPER, x, spawn, zed

bind = SUPER, q, killclient,

# Launcher / panels (simpbar stack).
bind = SUPER, space, spawn, appdrawer
bind = SUPER+SHIFT, space, spawn, rofi -show run
bind = SUPER, s, spawn, swaync-client -t
bind = SUPER+SHIFT, s, spawn, simpbar-config
bind = SUPER, w, spawn, appdrawer wallpapers
bind = SUPER+SHIFT, w, spawn, waypaper
bind = SUPER, c, spawn_shell, cliphist list | rofi -dmenu | cliphist decode | wl-copy
# Power menu (lock / log out / reboot / power off), from the app drawer.
bind = SUPER+SHIFT, q, spawn, appdrawer power

# Keybinds cheatsheet
bind = SUPER+SHIFT, k, spawn, foot -e less __HOME__/.config/mango/cfg/keybinds.conf

# simpbar-shell overview (window cards on the background layer).
bind = ALT, w, spawn, simpbar-shell overview toggle

# Screenshots (grim + slurp) — saved to ~/Pictures/Screenshots and copied to the
# clipboard via wl-copy. grim reads slurp's geometry straight from stdin.
bind = NONE, Print, spawn_shell, mkdir -p ~/Pictures/Screenshots && slurp | grim -g - - | tee ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy
bind = SUPER, p, spawn_shell, mkdir -p ~/Pictures/Screenshots && slurp | grim -g - - | tee ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy
bind = SUPER+SHIFT, p, spawn_shell, mkdir -p ~/Pictures/Screenshots && grim - | tee ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy
bind = SUPER+ALT, p, spawn_shell, mkdir -p ~/Pictures/Screenshots && grim - | tee ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy

# Reload config
bind = SUPER, r, reload_config

# Media controls
bind = NONE, XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = NONE, XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = NONE, XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = NONE, XF86AudioMicMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = NONE, XF86AudioNext, spawn, playerctl next
bind = NONE, XF86AudioPrev, spawn, playerctl previous
bind = NONE, XF86AudioPlay, spawn, playerctl play-pause

# Brightness controls
bind = NONE, XF86MonBrightnessUp, spawn, brightnessctl -e4 -n2 set 5%+
bind = NONE, XF86MonBrightnessDown, spawn, brightnessctl -e4 -n2 set 5%-

# Switch window focus
bind = SUPER, Tab, focusstack, next
bind = SUPER, Left, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, Up, focusdir, up
bind = SUPER, Down, focusdir, down

# Swap window
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Down, exchange_client, down
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right

# Switch window status
bind = SUPER, g, toggleglobal,
bind = ALT, Tab, toggleoverview,
bind = SUPER, v, togglefloating,
bind = SUPER, f, togglemaximizescreen,
bind = SUPER+SHIFT, f, togglefullscreen,
bind = SUPER+ALT, f, togglefakefullscreen,
bind = SUPER, i, minimized,
bind = SUPER, o, toggleoverlay,
bind = SUPER+SHIFT, I, restore_minimized
bind = SUPER, z, toggle_scratchpad

# Scroller layout
bind = SUPER+SHIFT, e, set_proportion, 1.0
bind = SUPER, x, switch_proportion_preset,

# Switch layout
bind = SUPER, n, switch_layout

# Switch between workspaces
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0

# Tag: move client to another workspace.
# Tagsilent: move client to another workspace but do not focus it.
# E.g bind = SUPER+SHIFT, 1, tagsilent, 1
bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

# Switch between monitors
bind = SUPER+ALT, Left, focusmon, left
bind = SUPER+ALT, Right, focusmon, right
# Move window to another monitor
bind = SUPER+SHIFT+ALT, Left, tagmon, left
bind = SUPER+SHIFT+ALT, Right, tagmon, right

# Gaps
bind = SUPER+SHIFT, X, incgaps, 1
bind = SUPER+SHIFT, Z, incgaps, -1
bind = SUPER+SHIFT, R, togglegaps

# Movewin
bind = CTRL+SHIFT, Up, movewin, +0, -50
bind = CTRL+SHIFT, Down, movewin, +0, +50
bind = CTRL+SHIFT, Left, movewin, -50,+0
bind = CTRL+SHIFT, Right, movewin, +50,+0

# Resizewin
bind = CTRL+ALT, Up, resizewin, +0, -50
bind = CTRL+ALT, Down, resizewin, +0, +50
bind = CTRL+ALT, Left, resizewin, -50, +0
bind = CTRL+ALT, Right, resizewin, +50, +0

# Mouse Button Bindings.
# btn_left and btn_right can't bind none mod key
mousebind = SUPER, btn_left, moveresize,curmove
mousebind = NONE, btn_middle, togglemaximizescreen, 0
mousebind = SUPER, btn_right, moveresize, curresize
