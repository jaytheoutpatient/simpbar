# | Auto Start |
# autostart your favorite applications here
#
# ligma
# Simpbar desktop stack:

# The bar itself.
exec_once = simpbar
# App drawer daemon (quickshell). Started up front so the launcher bind is a
# plain IPC round trip instead of a cold start on first press.
exec_once = appdrawer start
# Notification daemon.
exec_once = swaync
# Restore the wallpaper (also re-runs matugen so the whole desktop starts themed).
exec_once = simpbar-restore-wallpaper
# Desktop widgets (clock / weather / media / system cards) on the background layer.
exec_once = simpbar-shell
# Clipboard history store (Super+C reads it via cliphist + rofi).
exec_once = wl-paste --watch cliphist store
# Polkit authentication agent (GUI prompts for privileged actions).
exec_once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

exec_once = easyeffects --gapplication-service
