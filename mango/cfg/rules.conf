# | Rules |
# Window/Tag/Layer rules. | https://mangowm.github.io/docs/window-management/rules

window_rule = is_floating:1, app_id:[Ss]team
window_rule = is_floating:0, title:Steam
window_rule = is_floating:1, app_id:steam, title:Steam Settings

layer_rule = no_animation:1, no_blur:1, layer_name:selection
# simpbar: allow compositor blur behind the bar (needs blur_layer=1 above;
# the bar's own bg_opacity_percent tint controls the frosted strength)
layer_rule = no_blur:0, layer_name:simpbar
# desktop widgets (simpbar-shell cards): same deal — card_bg_opacity in
# ~/.config/simpbar/shell.json controls the frosted strength
layer_rule = no_blur:0, layer_name:simpbar-shell
