# | Outputs Configuration |
# Configure your monitors here or in the DMS "Displays" settings. | https://mangowm.github.io/docs/configuration/monitors
# Run `wlr-randr` to get your monitors information.
# You will have to remove "#" and edit it for it to take effect.
#
# The install script ships this file with the monitor line cleared (no name,
# resolution or refresh rate) so Mango picks up whatever your display reports.
# Fill in your own monitor specs here, e.g.:
# monitor_rule = name:DP-2, width:1920, height:1080, refresh:240, x:0, y:0, rr:0, vrr:0
#
# Easiest: open simpbar-config -> Mango -> Monitors and hit "Auto-detect
# Monitors" while MangoWM is running — it fills name, resolution, refresh
# and position from the connected displays for you.
